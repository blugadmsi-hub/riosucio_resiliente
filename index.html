<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Riosucio Resiliente — Mapa de Riesgo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#1B2420;
  --charcoal-2:#233026;
  --charcoal-3:#2C3B30;
  --parchment:#F5F3EC;
  --parchment-2:#ECE7D8;
  --gold:#C9A227;
  --gold-dark:#A9860F;
  --ink:#1B2420;
  --muted:#6C7568;
  --border:#D9D2BD;
  --red:#D7263D;
  --orange:#EF7F2E;
  --amber:#D9A017;
  --blue:#2C6E9E;
  --green:#2F8F5B;
  --radius:12px;
  --shadow:0 10px 30px rgba(15,20,15,.25);
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--font-body);color:var(--ink);background:var(--charcoal);overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--gold);color:var(--charcoal);}

/* ---------- Layout ---------- */
#app{display:flex;flex-direction:column;height:100vh;}
header{
  height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));
  border-bottom:1px solid #0d130f;z-index:900;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;color:var(--parchment);}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 30px;}
.brand-text h1{font-family:var(--font-display);font-size:16px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.2px;}
.brand-text span{display:block;font-size:10.5px;color:#A9B3A2;letter-spacing:.6px;text-transform:uppercase;margin-top:2px;}
.header-actions{display:flex;align-items:center;gap:8px;}
.session-badge{display:flex;align-items:center;gap:8px;color:var(--parchment);font-size:12.5px;background:rgba(255,255,255,.06);padding:5px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.1);}
.role-pill{background:var(--gold);color:var(--charcoal);font-weight:700;font-size:10px;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}

.btn{border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;transition:.15s;}
.btn-gold{background:var(--gold);color:var(--charcoal);}
.btn-gold:hover{background:var(--gold-dark);}
.btn-ghost{background:transparent;color:var(--parchment);border:1px solid rgba(255,255,255,.25);}
.btn-ghost:hover{background:rgba(255,255,255,.08);}
.btn-primary{background:var(--charcoal);color:var(--parchment);width:100%;padding:11px;border-radius:9px;font-size:13.5px;}
.btn-primary:hover{background:var(--charcoal-3);}
.btn-outline{background:transparent;color:var(--charcoal);border:1.4px solid var(--charcoal);padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;}
.btn-outline:hover{background:var(--parchment-2);}
.btn-danger{background:transparent;color:var(--red);border:1.4px solid var(--red);padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600;}
.btn-danger:hover{background:#fdecec;}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:7px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

main{position:relative;flex:1;min-height:0;}
#map{position:absolute;inset:0;background:#dfe3da;}

/* ---------- Semaphore legend / filter ribbon ---------- */
#semaphore{
  position:absolute;left:14px;top:14px;z-index:650;display:flex;flex-direction:column;gap:6px;
  background:rgba(27,36,32,.92);padding:8px;border-radius:12px;box-shadow:var(--shadow);
  backdrop-filter:blur(4px);
}
.sema-item{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;border-radius:8px;border:none;background:transparent;color:#EDEBE0;text-align:left;transition:.15s;opacity:1;}
.sema-item:hover{background:rgba(255,255,255,.08);}
.sema-item.off{opacity:.35;}
.sema-dot{width:16px;height:16px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);flex:0 0 16px;border:2px solid rgba(255,255,255,.85);}
.sema-label{font-size:11.5px;line-height:1.2;font-weight:600;}
.sema-label small{display:block;font-weight:400;color:#B8C0B0;font-size:9.5px;}
#semaphore-toggle{display:none;}

/* ---------- Map pins ---------- */
.map-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;background:var(--pin-color,#888);}
.map-pin span{transform:rotate(45deg);font-size:14px;}
.map-pin.pulse{animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(215,38,61,.55);}70%{box-shadow:0 0 0 14px rgba(215,38,61,0);}100%{box-shadow:0 0 0 0 rgba(215,38,61,0);}}

/* ---------- Popup ---------- */
.leaflet-popup-content-wrapper{border-radius:10px;font-family:var(--font-body);}
.popup-card{min-width:220px;}
.popup-card h3{margin:0 0 4px;font-family:var(--font-display);font-size:15px;}
.popup-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px;color:#fff;margin-bottom:6px;}
.popup-card p{margin:4px 0;font-size:12.5px;color:#33392f;line-height:1.4;}
.popup-card img{width:100%;border-radius:7px;margin-top:6px;max-height:140px;object-fit:cover;}
.popup-coords{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
.popup-link{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;}

/* ---------- Right panel ---------- */
#panel{
  position:absolute;top:14px;right:14px;bottom:14px;width:380px;max-width:calc(100vw - 28px);
  background:var(--parchment);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;z-index:700;border:1px solid var(--border);overflow:hidden;
}
.panel-tabs{display:flex;overflow-x:auto;background:var(--parchment-2);border-bottom:1px solid var(--border);flex:0 0 auto;}
.tab-btn{flex:1 0 auto;background:none;border:none;padding:11px 10px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;}
.tab-btn.active{color:var(--charcoal);border-bottom-color:var(--gold);}
.panel-body{flex:1;overflow-y:auto;padding:14px;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
.panel-collapse-btn{display:none;}

h2.pane-title{font-family:var(--font-display);font-size:17px;margin:0 0 4px;}
p.pane-sub{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.4;}

.search-box{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);font-size:12.5px;margin-bottom:10px;background:#fff;}

.list-item{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px 11px;margin-bottom:8px;}
.list-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.list-item h4{margin:0;font-size:13px;font-weight:700;}
.list-item p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35;}
.list-item .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:3px 8px;border-radius:20px;color:#fff;flex:0 0 auto;}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted);font-size:12.5px;}
.empty-state .glyph{font-size:26px;display:block;margin-bottom:8px;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:5px;color:var(--charcoal);}
.field .hint{font-weight:400;color:var(--muted);font-size:10.5px;display:block;margin-top:3px;}
.field input[type=text],.field input[type=number],.field input[type=password],.field textarea,.field select{
  width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);font-size:12.8px;background:#fff;
}
.field textarea{resize:vertical;min-height:64px;}
.coord-row{display:flex;gap:8px;}
.coord-row .field{flex:1;margin-bottom:0;}
.pick-btn{margin-top:8px;width:100%;background:var(--parchment-2);border:1.4px dashed var(--muted);border-radius:8px;padding:9px;font-size:12px;font-weight:600;color:var(--charcoal);}
.pick-btn.active{background:var(--gold);border-color:var(--gold-dark);color:var(--charcoal);border-style:solid;}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-opt{border:1.6px solid var(--border);border-radius:9px;padding:9px;font-size:11.5px;font-weight:600;text-align:left;background:#fff;display:flex;align-items:center;gap:7px;}
.type-opt .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;}
.type-opt.selected{border-color:var(--charcoal);background:var(--parchment-2);}
.photo-drop{border:1.6px dashed var(--border);border-radius:9px;padding:12px;text-align:center;font-size:11.5px;color:var(--muted);background:#fff;}
.photo-preview{position:relative;margin-top:8px;}
.photo-preview img{width:100%;border-radius:8px;max-height:130px;object-fit:cover;}
.photo-remove{position:absolute;top:6px;right:6px;background:rgba(27,36,32,.8);color:#fff;border:none;border-radius:6px;font-size:10.5px;padding:4px 7px;}
.form-actions{display:flex;gap:8px;margin-top:16px;}
.form-actions .btn-outline{flex:1;}
.back-link{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:0 0 12px;display:flex;align-items:center;gap:5px;}

.notif-card{border-left:4px solid var(--muted);}
.notif-card.kind-alerta{border-left-color:var(--red);}
.notif-card.kind-voluntariado{border-left-color:var(--gold-dark);}
.notif-card.kind-info{border-left-color:var(--blue);}
.notif-meta{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);margin-top:6px;}

.req-card.status-pending{border-left:4px solid var(--gold-dark);}
.req-card.status-approved{border-left:4px solid var(--green);opacity:.75;}
.req-card.status-rejected{border-left:4px solid var(--red);opacity:.6;}
.status-flag{font-size:10px;font-weight:700;text-transform:uppercase;}

.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.section-label{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}

/* ---------- FAB ---------- */
#fab-report{
  position:absolute;right:410px;bottom:24px;z-index:650;background:var(--gold);color:var(--charcoal);
  border:none;border-radius:30px;padding:13px 20px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;
}
#fab-report:hover{background:var(--gold-dark);}

/* ---------- Modal (login) ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,15,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--parchment);border-radius:14px;width:100%;max-width:360px;padding:22px;box-shadow:var(--shadow);}
.modal h2{font-family:var(--font-display);margin:0 0 4px;font-size:19px;}
.modal p.sub{font-size:12px;color:var(--muted);margin:0 0 16px;}
.modal-close{float:right;background:none;border:none;font-size:18px;color:var(--muted);}
.error-text{color:var(--red);font-size:12px;margin:6px 0 0;min-height:14px;}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;
  padding:11px 18px;border-radius:24px;font-size:12.5px;box-shadow:var(--shadow);z-index:1200;opacity:0;transition:.25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Mobile ---------- */
.mobile-panel-toggle{display:none;}
@media (max-width:760px){
  #panel{right:8px;left:8px;top:auto;bottom:0;width:auto;max-width:none;height:52%;border-radius:16px 16px 0 0;transition:height .2s;}
  #panel.collapsed{height:64px;}
  #panel.collapsed .panel-body{display:none;}
  #panel.collapsed .panel-tabs{display:none;}
  .panel-collapse-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;font-weight:700;font-size:12.5px;color:var(--charcoal);background:var(--parchment-2);border:none;flex:0 0 auto;}
  #fab-report{right:16px;bottom:calc(52% + 14px);}
  #semaphore{padding:6px;}
  .sema-label{display:none;}
  .brand-text span{display:none;}
  .session-badge span.uname{display:none;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">🗺️</div>
      <div class="brand-text">
        <h1>Riosucio Resiliente</h1>
        <span>Censo de riesgo · Caldas, Colombia</span>
      </div>
    </div>
    <div class="header-actions" id="header-actions">
      <button class="btn btn-ghost" id="btn-login">Ingresar como administrador</button>
    </div>
  </header>

  <main>
    <div id="map"></div>

    <div id="semaphore"></div>

    <button id="fab-report">📝 <span id="fab-label">Reportar afectación</span></button>

    <aside id="panel">
      <button class="panel-collapse-btn" id="panel-collapse-btn">▲ Panel</button>
      <div class="panel-tabs" id="panel-tabs">
        <button class="tab-btn active" data-tab="puntos">📍 Puntos</button>
        <button class="tab-btn" data-tab="acopio">📦 Acopio</button>
        <button class="tab-btn" data-tab="notificaciones">📣 Alertas</button>
        <button class="tab-btn admin-only" data-tab="solicitudes" hidden>🗂️ Solicitudes</button>
        <button class="tab-btn super-only" data-tab="admins" hidden>🔑 Admins</button>
      </div>
      <div class="panel-body" id="panel-body">

        <div class="tab-pane active" id="tab-puntos"></div>
        <div class="tab-pane" id="tab-acopio"></div>
        <div class="tab-pane" id="tab-notificaciones"></div>
        <div class="tab-pane" id="tab-solicitudes"></div>
        <div class="tab-pane" id="tab-admins"></div>

      </div>
    </aside>
  </main>
</div>

<div class="modal-overlay" id="login-overlay">
  <div class="modal">
    <button class="modal-close" id="login-close">✕</button>
    <h2>Acceso administrativo</h2>
    <p class="sub">Solo para el equipo de gestión del riesgo y voluntariado registrado.</p>
    <div class="field"><label>Usuario</label><input type="text" id="login-user" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="login-pass" autocomplete="current-password"></div>
    <p class="error-text" id="login-error"></p>
    <button class="btn-primary" id="login-submit">Ingresar</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ===================== CONFIG ===================== */
// 1) Reemplaza estos dos valores con los de tu proyecto Supabase:
//    Project Settings → API → Project URL / Project API keys → anon public
const SUPABASE_URL = 'https://nombndvaqbxbynahwudb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yatVaCvL5Q0pd6nUhfUGNw_W5hV87_e';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const RIOSUCIO = { lat: 5.4372, lng: -75.6998 };
const TYPES = {
  destruccion_total:   { label:'Destrucción total',        short:'Total',        color:'var(--red)',    hex:'#D7263D', glyph:'🏚️' },
  destruccion_parcial: { label:'Destrucción parcial',       short:'Parcial',      color:'var(--orange)', hex:'#EF7F2E', glyph:'🏠' },
  ayuda_alimentacion:  { label:'Necesita ayuda alimentaria', short:'Alimentación', color:'var(--amber)',  hex:'#D9A017', glyph:'🍲' },
  ayuda_materiales:    { label:'Necesita ayuda de materiales', short:'Materiales', color:'var(--blue)',   hex:'#2C6E9E', glyph:'🧰' },
};
const ACOPIO_STYLE = { color:'var(--green)', hex:'#2F8F5B', glyph:'📦' };
const NOTIF_KINDS = { alerta:{label:'Alerta',color:'#D7263D'}, voluntariado:{label:'Convocatoria voluntariado',color:'#A9860F'}, info:{label:'Informativo',color:'#2C6E9E'} };

/* ===================== STATE ===================== */
let session = null; // {username, name, role}
let points = [], acopios = [], requests = [], notifications = [], admins = [];
let map, layers = {};
let pickingFor = null; // 'point' | 'acopio' | 'request'
let editingPointId = null, editingAcopioId = null, approvingRequestId = null;
let formPhotoData = null, formType = 'destruccion_total';

/* ===================== STORAGE HELPERS (Supabase) ===================== */
// Cada "key" sigue el formato 'tabla_singular:id' (ej. 'point:abc123'), igual que antes.
// Estas funciones traducen ese formato a llamadas reales contra Supabase,
// así el resto de la app no necesita cambiar ni una línea más.
const TABLE_MAP = { admin:'admins', point:'points', acopio:'acopios', request:'requests', notification:'notifications' };
function splitKey(key){
  const i = key.indexOf(':');
  const prefix = key.slice(0, i);
  const id = key.slice(i + 1);
  return { table: TABLE_MAP[prefix], id };
}
async function stGet(key){
  try{
    const { table, id } = splitKey(key);
    const { data, error } = await sb.from(table).select('payload').eq('id', id).maybeSingle();
    if(error || !data) return null;
    return JSON.stringify(data.payload);
  }catch(e){ console.error('stGet', e); return null; }
}
async function stSet(key, value){
  try{
    const { table, id } = splitKey(key);
    const payload = JSON.parse(value);
    const { error } = await sb.from(table).upsert({ id, payload });
    if(error){ console.error('stSet', error); showToast('No se pudo guardar. Intenta de nuevo.'); return null; }
    return true;
  }catch(e){ console.error('stSet', e); showToast('No se pudo guardar. Intenta de nuevo.'); return null; }
}
async function stDelete(key){
  try{
    const { table, id } = splitKey(key);
    const { error } = await sb.from(table).delete().eq('id', id);
    if(error){ console.error('stDelete', error); return null; }
    return true;
  }catch(e){ console.error('stDelete', e); return null; }
}
async function loadPrefix(prefixWithColon){
  try{
    const table = TABLE_MAP[prefixWithColon.replace(':', '')];
    const { data, error } = await sb.from(table).select('payload');
    if(error){ console.error('loadPrefix', error); return []; }
    return data.map(r => r.payload);
  }catch(e){ console.error('loadPrefix', e); return []; }
}
function genId(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ===================== TOAST ===================== */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ===================== INIT ===================== */
async function init(){
  initMap();
  buildSemaphore();
  restoreSession();
  await ensureSuperAdmin();
  await refreshAll();
  bindGlobalUI();
  renderPuntosTab();
  renderAcopioTab();
  renderNotifTab();
  renderSolicitudesTab();
  renderAdminsTab();
  updateRoleUI();
}

function initMap(){
  map = L.map('map', { zoomControl:false }).setView([RIOSUCIO.lat, RIOSUCIO.lng], 14);
  L.control.zoom({ position:'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  Object.keys(TYPES).forEach(t=>{ layers[t] = L.layerGroup().addTo(map); });
  layers.acopio = L.layerGroup().addTo(map);
  layers.notif = L.layerGroup().addTo(map);

  map.on('click', onMapClick);
}

function onMapClick(e){
  if(!pickingFor) return;
  const { lat, lng } = e.latlng;
  if(pickingFor === 'point' || pickingFor === 'request'){
    document.getElementById('pf-lat').value = lat.toFixed(6);
    document.getElementById('pf-lng').value = lng.toFixed(6);
  } else if(pickingFor === 'acopio'){
    document.getElementById('af-lat').value = lat.toFixed(6);
    document.getElementById('af-lng').value = lng.toFixed(6);
  }
  setPicking(null);
  showToast('Ubicación seleccionada en el mapa');
}

function setPicking(mode){
  pickingFor = mode;
  document.querySelectorAll('.pick-btn').forEach(b=> b.classList.remove('active'));
  if(mode){
    const btn = document.getElementById(mode==='acopio' ? 'af-pick-btn' : 'pf-pick-btn');

/* ===================== SEMAPHORE (legend + filter) ===================== */
function buildSemaphore(){

  Object.entries(TYPES).forEach(([key,t])=>{
    html += `<button class="sema-item" data-layer="${key}"><span class="sema-dot" style="background:${t.hex}"></span><span class="sema-label">${t.label}<small>${t.glyph} riesgo</small></span></button>`;
  });
  html += `<button class="sema-item" data-layer="acopio"><span class="sema-dot" style="background:${ACOPIO_STYLE.hex};border-radius:4px;transform:none;"></span><span class="sema-label">Puntos de acopio<small>📦 recursos</small></span></button>`;
  el.innerHTML = html;
  el.querySelectorAll('.sema-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.layer;

      if(map.hasLayer(lg)){ map.removeLayer(lg); btn.classList.add('off'); }
      else { map.addLayer(lg); btn.classList.remove('off'); }

  });
}

function persistSession(){

async function ensureSuperAdmin(){

/* ===================== DATA REFRESH ===================== */
async function refreshAll(){
  const [p,a,r,n] = await Promise.all([
    loadPrefix('point:'), loadPrefix('acopio:'), loadPrefix('request:'), loadPrefix('notification:')
  ]);
  points = p.sort((x,y)=> (y.createdAt||0)-(x.createdAt||0));
  acopios = a.sort((x,y)=> (y.createdAt||0)-(x.createdAt||0));
  requests = r.sort((x,y)=> (y.createdAt||0)-(x.createdAt||0));
  notifications = n.sort((x,y)=> (y.createdAt||0)-(x.createdAt||0));
  if(session){ admins = await loadPrefix('admin:'); }
  renderMarkers();
}

function renderMarkers(){
  Object.values(layers).forEach(lg=> lg.clearLayers());
  points.forEach(pt=>{
    const t = TYPES[pt.type] || TYPES.destruccion_parcial;
    const marker = L.marker([pt.lat, pt.lng], { icon: pinIcon(t.hex, t.glyph) });
    marker.bindPopup(pointPopupHtml(pt, t));
    marker.addTo(layers[pt.type] || layers.destruccion_parcial);
    pt._marker = marker;
  });
  acopios.forEach(ac=>{
    const marker = L.marker([ac.lat, ac.lng], { icon: pinIcon(ACOPIO_STYLE.hex, ACOPIO_STYLE.glyph) });
    marker.bindPopup(acopioPopupHtml(ac));
    marker.addTo(layers.acopio);
    ac._marker = marker;
  });
  notifications.filter(n=> n.lat && n.lng).forEach(n=>{
    const marker = L.marker([n.lat, n.lng], { icon: pinIcon(NOTIF_KINDS[n.kind]?.color || '#888', '📣') });
    marker.bindPopup(`<div class="popup-card"><h3>${escapeHtml(n.title)}</h3><p>${escapeHtml(n.message)}</p></div>`);
    marker.addTo(layers.notif);
  });
}

function pinIcon(hex, glyph){
  return L.divIcon({ className:'', html:`<div class="map-pin" style="--pin-color:${hex}"><span>${glyph}</span></div>`, iconSize:[30,30], iconAnchor:[15,29], popupAnchor:[0,-26] });
}

function pointPopupHtml(pt, t){
  const gmaps = `https://www.google.com/maps?q=${pt.lat},${pt.lng}`;
  return `<div class="popup-card">
    <span class="popup-tag" style="background:${t.hex}">${t.label}</span>
    <h3>${escapeHtml(pt.names || 'Punto afectado')}</h3>
    <p>${escapeHtml(pt.description || '')}</p>
    ${pt.address ? `<p><strong>Dirección:</strong> ${escapeHtml(pt.address)}</p>` : ''}
    ${pt.mapsCode ? `<p><strong>Código Google Maps:</strong> ${escapeHtml(pt.mapsCode)}</p>` : ''}
    <p class="popup-coords">${pt.lat.toFixed(6)}, ${pt.lng.toFixed(6)}</p>
    ${pt.photo ? `<img src="${pt.photo}" alt="Foto del punto">` : ''}
    <a class="popup-link" href="${gmaps}" target="_blank" rel="noopener">Cómo llegar →</a>
  </div>`;
}
function acopioPopupHtml(ac){
  const gmaps = `https://www.google.com/maps?q=${ac.lat},${ac.lng}`;
  return `<div class="popup-card">
    <span class="popup-tag" style="background:${ACOPIO_STYLE.hex}">Punto de acopio</span>
    <h3>${escapeHtml(ac.name)}</h3>
    <p>${escapeHtml(ac.description || '')}</p>
    ${ac.address ? `<p><strong>Dirección:</strong> ${escapeHtml(ac.address)}</p>` : ''}
    ${ac.contact ? `<p><strong>Contacto:</strong> ${escapeHtml(ac.contact)}</p>` : ''}
    <p class="popup-coords">${ac.lat.toFixed(6)}, ${ac.lng.toFixed(6)}</p>
    <a class="popup-link" href="${gmaps}" target="_blank" rel="noopener">Cómo llegar →</a>
  </div>`;
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }

/* ===================== ROLE / UI STATE ===================== */
function isAdmin(){ return !!session; }
function isSuper(){ return session && session.role === 'super'; }

function updateRoleUI(){
  document.querySelectorAll('.admin-only').forEach(el=> el.hidden = !isAdmin());

/* ===================== LOGIN ===================== */
function openLogin(){
  document.getElementById('login-overlay').classList.add('open');
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}
function closeLogin(){ document.getElementById('login-overlay').classList.remove('open'); }
async function doLogin(){
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  if(!user || !pass){ errEl.textContent = 'Ingresa usuario y contraseña.'; return; }
  const raw = await stGet('admin:' + user);
  if(!raw){ errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
  const rec = JSON.parse(raw);
  const hash = await sha256(pass);
  if(hash !== rec.passwordHash){ errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
  session = { username: rec.username, name: rec.name, role: rec.role };
  persistSession();
  closeLogin();
  showToast(`Bienvenido/a, ${rec.name}`);
  admins = await loadPrefix('admin:');
  updateRoleUI();
  renderPuntosTab(); renderAcopioTab(); renderNotifTab(); renderSolicitudesTab(); renderAdminsTab();
}
function logout(){
  session = null; persistSession(); updateRoleUI();
  switchTab('puntos');
  renderPuntosTab(); renderAcopioTab(); renderNotifTab();
  showToast('Sesión cerrada');
}

function updatePhotoPreview(){
  const drop = document.getElementById('pf-photo-drop');
  const prev = document.getElementById('pf-photo-preview');
  if(formPhotoData){ drop.style.display='none'; prev.style.display='block'; document.getElementById('pf-photo-img').src = formPhotoData; }
  else { drop.style.display='block'; prev.style.display='none'; document.getElementById('pf-photo-input').value=''; }
}
function handlePhotoUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      formPhotoData = canvas.toDataURL('image/jpeg', 0.72);
      updatePhotoPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitPointForm(mode, existing){
  const names = document.getElementById('pf-names').value.trim();
  const description = document.getElementById('pf-desc').value.trim();
  const address = document.getElementById('pf-address').value.trim();
  const mapsCode = document.getElementById('pf-mapscode').value.trim();
  const lat = parseFloat(document.getElementById('pf-lat').value);
  const lng = parseFloat(document.getElementById('pf-lng').value);

  if(isNaN(lat) || isNaN(lng)){ showToast('Falta la ubicación (latitud y longitud).'); return; }
  if(!description){ showToast('Describe brevemente el caso.'); return; }

  const payload = { type: formType, names, description, address, mapsCode, lat, lng, photo: formPhotoData };

  if(mode === 'request'){
    const reporterContact = document.getElementById('pf-reporter')?.value.trim() || '';
    const id = genId();
    await stSet('request:' + id, JSON.stringify({ ...payload, id, reporterContact, status:'pending', createdAt: Date.now() }));
    showToast('Reporte enviado. Un administrador lo revisará pronto. ¡Gracias!');
  } else if(mode === 'new'){
    const id = genId();
    await stSet('point:' + id, JSON.stringify({ ...payload, id, createdBy: session.username, createdAt: Date.now() }));
    showToast('Punto agregado al mapa');
  } else if(mode === 'edit'){
    await stSet('point:' + existing.id, JSON.stringify({ ...existing, ...payload, updatedAt: Date.now(), updatedBy: session.username }));
    showToast('Punto actualizado');
  } else if(mode === 'approve'){
    const id = genId();
    await stSet('point:' + id, JSON.stringify({ ...payload, id, createdBy: session.username, createdAt: Date.now(), fromRequest: existing.id }));
    await stSet('request:' + existing.id, JSON.stringify({ ...existing, status:'approved', reviewedBy: session.username, reviewedAt: Date.now() }));
    showToast('Solicitud aprobada y publicada en el mapa');
  }

  setPicking(null);
  await refreshAll();
  renderPuntosTab();
  renderSolicitudesTab();
}

      <div class="coord-row">
        <div class="field"><input type="number" step="0.000001" id="af-lat" value="${data.lat ?? ''}" placeholder="Latitud"></div>
        <div class="field"><input type="number" step="0.000001" id="af-lng" value="${data.lng ?? ''}" placeholder="Longitud"></div>
      </div>
      <button type="button" class="pick-btn" id="af-pick-btn">📍 Seleccionar ubicación en el mapa</button>
    </div>
    <div class="form-actions">
      <button class="btn-outline" id="af-cancel">Cancelar</button>
      <button class="btn-primary" id="af-submit" style="flex:1.4">Guardar</button>
    </div>
  `;
  document.getElementById('af-back').addEventListener('click', ()=>{ setPicking(null); renderAcopioTab(); });
  document.getElementById('af-cancel').addEventListener('click', ()=>{ setPicking(null); renderAcopioTab(); });
  document.getElementById('af-pick-btn').addEventListener('click', ()=> setPicking(pickingFor==='acopio'?null:'acopio'));
  document.getElementById('af-submit').addEventListener('click', ()=> submitAcopioForm(mode, existing));
}
async function submitAcopioForm(mode, existing){
  const name = document.getElementById('af-name').value.trim();
  const description = document.getElementById('af-desc').value.trim();
  const address = document.getElementById('af-address').value.trim();
  const contact = document.getElementById('af-contact').value.trim();
  const lat = parseFloat(document.getElementById('af-lat').value);
  const lng = parseFloat(document.getElementById('af-lng').value);
  if(!name){ showToast('El punto de acopio necesita un nombre.'); return; }
  if(isNaN(lat) || isNaN(lng)){ showToast('Falta la ubicación (latitud y longitud).'); return; }
  const payload = { name, description, address, contact, lat, lng };
  if(mode==='new'){
    const id = genId();
    await stSet('acopio:' + id, JSON.stringify({ ...payload, id, createdBy: session.username, createdAt: Date.now() }));
    showToast('Punto de acopio creado');
  } else {
    await stSet('acopio:' + existing.id, JSON.stringify({ ...existing, ...payload, updatedAt: Date.now() }));
    showToast('Punto de acopio actualizado');
  }
  setPicking(null);
  await refreshAll(); renderAcopioTab();
}

/* ===================== NOTIFICACIONES TAB ===================== */
function renderNotifTab(){
  const el = document.getElementById('tab-notificaciones');
  el.innerHTML = `
    <h2 class="pane-title">Alertas y voluntariado</h2>
    <p class="pane-sub">Convocatorias, puntos de encuentro y alertas del equipo de gestión del riesgo.</p>
    ${isAdmin() ? '<button class="btn-primary" id="btn-new-notif">+ Nueva notificación</button><hr class="divider">' : ''}
    <div id="notif-list"></div>
  `;
  if(isAdmin()) document.getElementById('btn-new-notif').addEventListener('click', openNotifForm);
  renderNotifList();
}
function renderNotifList(){
  const list = document.getElementById('notif-list');
  if(!notifications.length){ list.innerHTML = `<div class="empty-state"><span class="glyph">📣</span>No hay notificaciones activas.</div>`; return; }
  list.innerHTML = notifications.map(n=>{
    const k = NOTIF_KINDS[n.kind] || NOTIF_KINDS.info;
    const date = n.createdAt ? new Date(n.createdAt).toLocaleString('es-CO', { dateStyle:'medium', timeStyle:'short' }) : '';
    return `<div class="list-item notif-card kind-${n.kind}" data-id="${n.id}">
      <h4>${escapeHtml(n.title)}</h4>
      <p>${escapeHtml(n.message)}</p>
      ${n.meetingPoint ? `<p><strong>Punto de encuentro:</strong> ${escapeHtml(n.meetingPoint)}</p>` : ''}
      <div class="notif-meta">${k.label} · ${date}</div>
      <div class="row">
        ${(n.lat && n.lng) ? `<button class="btn-outline btn-sm" data-act="fly">Ver en mapa</button>` : ''}
        ${isAdmin() ? `<button class="btn-danger btn-sm" data-act="del">Eliminar</button>` : ''}
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.list-item').forEach(card=>{
    const n = notifications.find(x=>x.id===card.dataset.id);
    const flyBtn = card.querySelector('[data-act="fly"]'); if(flyBtn) flyBtn.addEventListener('click', ()=> map.flyTo([n.lat,n.lng],17,{duration:0.6}));
    const delBtn = card.querySelector('[data-act="del"]'); if(delBtn) delBtn.addEventListener('click', ()=> deleteNotif(n));
  });
}
async function deleteNotif(n){
  if(!confirm('¿Eliminar esta notificación?')) return;
  await stDelete('notification:' + n.id);
  await refreshAll(); renderNotifList(); showToast('Notificación eliminada');
}
function openNotifForm(){
  const el = document.getElementById('tab-notificaciones');
  el.innerHTML = `
    <button class="back-link" id="nf-back">← Volver a la lista</button>
    <h2 class="pane-title">Nueva notificación</h2>
    <div class="field"><label>Tipo</label>
      <select id="nf-kind">
        <option value="alerta">🚨 Alerta</option>
        <option value="voluntariado">🙋 Convocatoria de voluntariado</option>
        <option value="info">ℹ️ Informativo</option>
      </select>
    </div>
    <div class="field"><label>Título</label><input type="text" id="nf-title" placeholder="Ej: Se necesitan voluntarios en zona rural"></div>
    <div class="field"><label>Mensaje</label><textarea id="nf-msg" placeholder="Detalles de la alerta o convocatoria…"></textarea></div>
    <div class="field"><label>Punto de encuentro <span class="hint">(texto, opcional)</span></label><input type="text" id="nf-meeting" placeholder="Ej: Parque principal de Riosucio, 8:00 a.m."></div>
    <div class="field"><label>Ubicación en el mapa <span class="hint">(opcional)</span></label>
      <div class="coord-row">
        <div class="field"><input type="number" step="0.000001" id="nf-lat" placeholder="Latitud"></div>
        <div class="field"><input type="number" step="0.000001" id="nf-lng" placeholder="Longitud"></div>
      </div>
      <button type="button" class="pick-btn" id="nf-pick-btn">📍 Seleccionar ubicación en el mapa</button>
    </div>
    <div class="form-actions">
      <button class="btn-outline" id="nf-cancel">Cancelar</button>
      <button class="btn-primary" id="nf-submit" style="flex:1.4">Publicar</button>
    </div>
  `;
  document.getElementById('nf-back').addEventListener('click', ()=>{ setPicking(null); renderNotifTab(); });
  document.getElementById('nf-cancel').addEventListener('click', ()=>{ setPicking(null); renderNotifTab(); });
  document.getElementById('nf-pick-btn').addEventListener('click', ()=>{
    pickingFor = pickingFor==='notif' ? null : 'notif';
    const btn = document.getElementById('nf-pick-btn');
    btn.classList.toggle('active', pickingFor==='notif');
    btn.textContent = pickingFor==='notif' ? '📍 Haz clic en el mapa para ubicar el punto…' : '📍 Seleccionar ubicación en el mapa';
  });
  // custom click handling for notif picking (separate from point/acopio pickingFor values)
  const origClick = map._events.click;
  map.off('click', onMapClick);
  map.on('click', function notifPick(e){
    if(pickingFor !== 'notif'){ return; }
    document.getElementById('nf-lat').value = e.latlng.lat.toFixed(6);
    document.getElementById('nf-lng').value = e.latlng.lng.toFixed(6);
    pickingFor = null;
    const btn = document.getElementById('nf-pick-btn'); if(btn){ btn.classList.remove('active'); btn.textContent = '📍 Seleccionar ubicación en el mapa'; }
    map.off('click', notifPick);
    map.on('click', onMapClick);
    showToast('Ubicación seleccionada');
  });
  document.getElementById('nf-submit').addEventListener('click', submitNotifForm);
}
async function submitNotifForm(){
  const kind = document.getElementById('nf-kind').value;
  const title = document.getElementById('nf-title').value.trim();
  const message = document.getElementById('nf-msg').value.trim();
  const meetingPoint = document.getElementById('nf-meeting').value.trim();
  const lat = parseFloat(document.getElementById('nf-lat').value);
  const lng = parseFloat(document.getElementById('nf-lng').value);
  if(!title || !message){ showToast('Completa el título y el mensaje.'); return; }
  const id = genId();
  const payload = { id, kind, title, message, meetingPoint, createdBy: session.username, createdAt: Date.now() };
  if(!isNaN(lat) && !isNaN(lng)){ payload.lat = lat; payload.lng = lng; }
  await stSet('notification:' + id, JSON.stringify(payload));
  showToast('Notificación publicada');
  pickingFor = null;
  await refreshAll(); renderNotifTab();
}

/* ===================== SOLICITUDES TAB ===================== */
function renderSolicitudesTab(){
  const el = document.getElementById('tab-solicitudes');
  if(!isAdmin()){ el.innerHTML=''; return; }
  const pending = requests.filter(r=>r.status==='pending');
  const reviewed = requests.filter(r=>r.status!=='pending');
  el.innerHTML = `
    <h2 class="pane-title">Solicitudes de la comunidad</h2>
    <p class="pane-sub">Reportes enviados por la ciudadanía, pendientes de revisión.</p>
    <div id="req-pending"></div>
    ${reviewed.length ? '<div class="section-label">Ya revisadas</div><div id="req-reviewed"></div>' : ''}
  `;
  const pendEl = document.getElementById('req-pending');
  pendEl.innerHTML = pending.length ? pending.map(reqCardHtml).join('') : `<div class="empty-state"><span class="glyph">✅</span>No hay solicitudes pendientes.</div>`;
  pendEl.querySelectorAll('.list-item').forEach(card=> bindReqCard(card));
  if(reviewed.length){
    const revEl = document.getElementById('req-reviewed');
    revEl.innerHTML = reviewed.slice(0,20).map(reqCardHtml).join('');
  }
}
function reqCardHtml(r){
  const t = TYPES[r.type] || TYPES.destruccion_parcial;
  const date = r.createdAt ? new Date(r.createdAt).toLocaleDateString('es-CO') : '';
  const statusLabel = r.status==='pending' ? 'Pendiente' : r.status==='approved' ? 'Aprobada' : 'Rechazada';
  return `<div class="list-item req-card status-${r.status}" data-id="${r.id}">
    <div class="list-item-top"><div><h4>${escapeHtml(r.names||'Reporte ciudadano')}</h4><p>${escapeHtml(r.address||'')}</p></div><span class="tag" style="background:${t.hex}">${t.short}</span></div>
    <p>${escapeHtml(r.description||'')}</p>
    ${r.reporterContact ? `<p><strong>Contacto:</strong> ${escapeHtml(r.reporterContact)}</p>` : ''}
    <div class="notif-meta">${date} · <span class="status-flag">${statusLabel}</span></div>
    ${r.status==='pending' ? `<div class="row"><button class="btn-outline btn-sm" data-act="fly">Ver ubicación</button><button class="btn-primary" style="flex:none;padding:6px 12px;font-size:11.5px" data-act="approve">Aprobar</button><button class="btn-danger btn-sm" data-act="reject">Rechazar</button></div>` : ''}
  </div>`;
}
function bindReqCard(card){
  const r = requests.find(x=>x.id===card.dataset.id);
  const flyBtn = card.querySelector('[data-act="fly"]'); if(flyBtn) flyBtn.addEventListener('click', ()=> map.flyTo([r.lat,r.lng],17,{duration:0.6}));
  const apBtn = card.querySelector('[data-act="approve"]'); if(apBtn) apBtn.addEventListener('click', ()=>{ switchTab('puntos'); openPointForm('approve', r); });
  const rjBtn = card.querySelector('[data-act="reject"]'); if(rjBtn) rjBtn.addEventListener('click', ()=> rejectRequest(r));
}
async function rejectRequest(r){
  const reason = prompt('Motivo del rechazo (opcional):', '') || '';
  await stSet('request:' + r.id, JSON.stringify({ ...r, status:'rejected', reviewedBy: session.username, reviewedAt: Date.now(), rejectReason: reason }));
  showToast('Solicitud rechazada');
  await refreshAll(); renderSolicitudesTab();
}

/* ===================== ADMINS TAB ===================== */
function renderAdminsTab(){
  const el = document.getElementById('tab-admins');
  if(!isSuper()){ el.innerHTML=''; return; }
  el.innerHTML = `
    <h2 class="pane-title">Administradores</h2>
    <p class="pane-sub">Gestiona quién puede editar el mapa de riesgo.</p>
    <div id="admins-list"></div>
    <hr class="divider">
    <div class="section-label">Agregar nuevo administrador</div>
    <div class="field"><label>Nombre completo</label><input type="text" id="na-name"></div>
    <div class="field"><label>Usuario</label><input type="text" id="na-user" placeholder="sin espacios"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="na-pass"></div>
    <div class="field"><label>Rol</label>
      <select id="na-role"><option value="admin">Administrador</option><option value="super">Administrador principal</option></select>
    </div>
    <button class="btn-primary" id="na-submit">Crear administrador</button>
  `;
  const list = document.getElementById('admins-list');
  list.innerHTML = admins.map(a=> `
    <div class="list-item" data-user="${escapeHtml(a.username)}">
      <div class="list-item-top"><div><h4>${escapeHtml(a.name)}</h4><p>@${escapeHtml(a.username)}</p></div><span class="tag" style="background:${a.role==='super'?'var(--gold-dark)':'var(--charcoal)'}">${a.role==='super'?'Principal':'Admin'}</span></div>
      ${a.username !== session.username ? `<div class="row"><button class="btn-danger btn-sm" data-act="del">Eliminar</button></div>` : `<div class="row"><span class="hint" style="font-size:11px;color:var(--muted)">Esta es tu cuenta</span></div>`}
    </div>`).join('');
  list.querySelectorAll('[data-act="del"]').forEach(btn=>{
    btn.addEventListener('click', ()=> removeAdmin(btn.closest('.list-item').dataset.user));
  });
  document.getElementById('na-submit').addEventListener('click', addAdmin);
}
async function addAdmin(){
  const name = document.getElementById('na-name').value.trim();
  const username = document.getElementById('na-user').value.trim().toLowerCase().replace(/\s+/g,'');
  const pass = document.getElementById('na-pass').value;
  const role = document.getElementById('na-role').value;
  if(!name || !username || !pass){ showToast('Completa todos los campos.'); return; }
  const existing = await stGet('admin:' + username);
  if(existing){ showToast('Ese usuario ya existe.'); return; }
  const passwordHash = await sha256(pass);
  await stSet('admin:' + username, JSON.stringify({ username, name, role, passwordHash, createdAt: Date.now(), createdBy: session.username }));
  showToast('Administrador creado');
  admins = await loadPrefix('admin:');
  renderAdminsTab();
}
async function removeAdmin(username){
  const target = admins.find(a=>a.username===username);
  if(!target) return;
  const superCount = admins.filter(a=>a.role==='super').length;
  if(target.role==='super' && superCount<=1){ showToast('Debe existir al menos un administrador principal.'); return; }
  if(!confirm(`¿Eliminar al administrador @${username}?`)) return;
  await stDelete('admin:' + username);
  admins = await loadPrefix('admin:');
  renderAdminsTab();
  showToast('Administrador eliminado');
}

/* ===================== START ===================== */
init();
</script>
